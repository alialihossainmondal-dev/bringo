<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order details | Bringo</title>
<meta name="description" content="Order details, status and receipt.">
<meta name="theme-color" content="#14307e">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bringo">
<meta property="og:title" content="Order details | Bringo">
<meta property="og:description" content="Order details, status and receipt.">
<meta property="og:image" content="https://bringo-steel.vercel.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/theme.css">
</head>
<body>
<main id="main">
  <div class="wrap">
    <nav class="crumbs no-print" aria-label="Breadcrumb"><a href="index.html">Home</a><span data-i="chevron"></span><a href="order.html">My orders</a><span data-i="chevron"></span><span aria-current="page" id="crumb-id">Order</span></nav>
    <div id="view" aria-live="polite" style="margin-top:14px">
      <div class="card"><div class="skel skel-line" style="width:40%;height:20px;margin:0"></div><div class="skel skel-line" style="width:70%"></div><div class="skel skel-line" style="width:100%;height:46px;margin-top:20px"></div></div>
    </div>
  </div>
</main>

<script type="module">
import { db, doc, getDoc, updateDoc } from './common/firebase-config.js';
import { mountChrome, icon, esc, $, $$, rupee, whenUser, loginUrl, emptyState, getSettings, waLink, openSheet, toast, setItemQty, etaRange } from './common/app.js';
import { when, fmtDate, shortId, trackerHtml, statusTag, isActive, isDelivered, isClosed, canCancel, STEP_OF } from './common/orders.js';

mountChrome({ variant: 'inner', title: 'Order details', back: 'order.html', active: 'orders' });
$$('[data-i]').forEach((el) => { el.innerHTML = icon(el.dataset.i); });
const id = new URLSearchParams(location.search).get('id');
let order = null, s = null;
const view = $('#view');

const CANCEL_REASONS = ['I ordered by mistake', 'I want to change the address or items', 'Delivery is taking too long', 'I found a better price', 'Other'];
const RETURN_REASONS = ['Damaged or broken item', 'Wrong item received', 'Item not as described', 'Quality is not what I expected', 'Other'];

function returnWindow(o) {
  const base = when(o.delivered_at) || when(o.created_at);
  if (!base) return { open: false, days: s.return_days };
  const days = Number(s.return_days) || 0;
  const left = Math.ceil((base.getTime() + days * 86400000 - Date.now()) / 86400000);
  return { open: o.status === 'Delivered' && left > 0, left, days };
}

function render() {
  const o = order;
  const placed = when(o.created_at);
  const items = o.items || [];
  const sub = Number(o.subtotal) || items.reduce((n, i) => n + i.price * i.qty, 0);
  const snap = o.address_snapshot;
  const rw = returnWindow(o);
  const help = waLink(s.whatsapp, `Hi Bringo, I need help with order #${shortId(o.id)}.`);
  $('#crumb-id').textContent = `Order #${shortId(o.id)}`;
  document.title = `Order #${shortId(o.id)} | Bringo`;

  const cr = o.cancel_request && !o.cancel_request.dismissed ? o.cancel_request : null;
  const rr = o.return_request && !o.return_request.dismissed ? o.return_request : null;
  let banner = '';
  if (cr && o.status !== 'Cancelled') banner = `<div class="notice-line">${icon('clock')}<span>Cancellation requested. We will confirm it shortly, usually within a working day.</span></div>`;
  else if (rr && !isClosed(o)) banner = `<div class="notice-line">${icon('clock')}<span>${esc(rr.type)} request received. We will contact you on WhatsApp to arrange it.</span></div>`;
  else if (o.status === 'Return accepted' || o.status === 'Replacement accepted') banner = `<div class="notice-line" style="background:var(--ok-50);color:var(--ok)">${icon('check')}<span>${esc(o.status)}. We will contact you on WhatsApp with the next steps.</span></div>`;
  else if (isActive(o)) banner = `<div class="notice-line" style="background:var(--ok-50);color:var(--ok)">${icon('truck')}<span>Expected delivery: ${esc(etaRange(s, placed || new Date()))}</span></div>`;

  const actions = [];
  actions.push(`<a class="btn btn-outline" href="${esc(help)}" target="_blank" rel="noopener">${icon('whatsapp')} Need help?</a>`);
  if (canCancel(o)) actions.push(`<button class="btn btn-outline" id="do-cancel">${icon('x')} Cancel order</button>`);
  if (o.status === 'Delivered' && !rr) actions.push(rw.open ? `<button class="btn btn-outline" id="do-return">${icon('undo')} Return or replace</button>` : '');
  actions.push(`<button class="btn btn-outline" id="do-buy">${icon('repeat')} Buy again</button>`);
  actions.push(`<button class="btn btn-outline" id="do-print">${icon('printer')} Download receipt</button>`);

  view.innerHTML = `
    <div class="print-only" style="margin-bottom:12px"><h1 style="font:800 26px var(--font-display)">Bringo</h1><p>Order receipt</p>${s.address ? `<p>${esc(s.address)}</p>` : ''}${s.phone ? `<p>${esc(s.phone)}</p>` : ''}</div>
    <div class="ov-grid">
      <div class="stack">
        <section class="card">
          <div class="order-top"><div><div class="order-id">Order #${shortId(o.id)}</div><div class="muted" style="font-size:14px">${placed ? 'Placed on ' + fmtDate(placed, true) : ''}</div></div>${statusTag(o)}</div>
          ${trackerHtml(o, 'track-lg')}
          ${banner}
        </section>
        <section class="card"><h2 class="card-title">${icon('bag')}Items in this order</h2>
          <ul class="ov-items">${items.map((i) => `<li><img src="${esc(i.image || '')}" alt="" width="64" height="64"><div class="grow"><a class="nm" href="product_detail.html?id=${encodeURIComponent(i.id)}">${esc(i.name)}</a><span class="muted" style="font-size:14px">${rupee(i.price)} x ${Number(i.qty)}</span></div><b>${rupee(i.price * i.qty)}</b></li>`).join('')}</ul>
        </section>
      </div>
      <div class="stack">
        <section class="card"><h2 class="card-title">${icon('wallet')}Payment</h2>
          <div class="sum-row"><span>Items subtotal</span><span>${rupee(sub)}</span></div>
          ${Number(o.discount_amount) ? `<div class="sum-row disc"><span>Coupon ${o.promo_code_used && o.promo_code_used !== 'None' ? esc(o.promo_code_used) : ''}</span><span>-${rupee(o.discount_amount)}</span></div>` : ''}
          <div class="sum-total"><span>Total</span><span>${rupee(o.total_amount)}</span></div>
          <p class="muted" style="font-size:14px;margin-top:8px">${o.payment_method === 'prepaid' ? 'Paid by UPI (prepaid)' : 'Pay in cash on delivery'}</p>
        </section>
        <section class="card"><h2 class="card-title">${icon('pin')}Delivery address</h2>
          ${snap ? `<p><b>${esc(snap.name)}</b></p><p>${esc([snap.line1, snap.line2, snap.city, snap.state].filter(Boolean).join(', '))} - ${esc(snap.pin)}</p>` : `<p>${esc(o.delivery_address || '')}</p>`}
          <p class="muted" style="margin-top:6px">Mobile: ${esc(o.phone_number || '')}</p>
          ${o.customer_notes && o.customer_notes !== 'No extra notes provided' ? `<p class="muted" style="margin-top:6px">Note: ${esc(o.customer_notes)}</p>` : ''}
        </section>
        <section class="card no-print"><div class="row-actions">${actions.join('')}</div>
          ${o.status === 'Delivered' && !rr ? `<p class="muted" style="font-size:13.5px;margin-top:10px">${rw.open ? `Returns open for ${rw.left} more day${rw.left === 1 ? '' : 's'} (${rw.days}-day window).` : `The ${rw.days}-day return window has ended.`}</p>` : ''}
        </section>
      </div>
    </div>`;
  $('#do-print')?.addEventListener('click', () => window.print());
  $('#do-buy')?.addEventListener('click', () => {
    items.forEach((i) => setItemQty({ id: i.id, name: i.name, price: i.price, image_url: i.image, payment_type: i.type }, Number(i.qty)));
    toast('Added to your cart'); setTimeout(() => { location.href = 'cart.html'; }, 600);
  });
  $('#do-cancel')?.addEventListener('click', () => requestSheet('cancel'));
  $('#do-return')?.addEventListener('click', () => requestSheet('return'));
}

function requestSheet(kind) {
  const cancel = kind === 'cancel';
  const reasons = cancel ? CANCEL_REASONS : RETURN_REASONS;
  const html = `${cancel ? '' : `<div class="field"><label>What would you like?</label><div class="seg"><label><input type="radio" name="rt" value="Return" checked><span>Return</span></label><label><input type="radio" name="rt" value="Replace"><span>Replace</span></label></div></div><div style="height:12px"></div>`}
    <div class="field"><label for="rs">Reason</label><select class="input" id="rs"><option value="">Select a reason</option>${reasons.map((r) => `<option>${r}</option>`).join('')}</select><div class="field-err" id="e-rs" hidden></div></div>
    <div class="field" style="margin-top:12px"><label for="rn">Anything else? <span class="muted" style="font-weight:500">(optional)</span></label><textarea class="textarea" id="rn" style="min-height:70px"></textarea></div>
    ${cancel ? '' : '<p class="muted" style="font-size:13.5px;margin-top:10px">Keep the item unused and in its original packing. We will reach you on WhatsApp to arrange pickup.</p>'}`;
  const sh = openSheet({ title: cancel ? 'Cancel this order' : 'Return or replace', html, foot: '<button class="btn btn-outline" data-close>Back</button><button class="btn btn-primary" id="rq-go">Send request</button>' });
  $('#rq-go', sh.el).addEventListener('click', async () => {
    const reason = $('#rs', sh.el).value;
    const e = $('#e-rs', sh.el);
    e.hidden = !!reason; e.textContent = reason ? '' : 'Please choose a reason.';
    if (!reason) return;
    const payload = { reason, note: $('#rn', sh.el).value.trim(), requested_at: new Date(), ...(cancel ? {} : { type: sh.el.querySelector('input[name="rt"]:checked').value }) };
    const btn = $('#rq-go', sh.el); btn.disabled = true; btn.textContent = 'Sending';
    try {
      await updateDoc(doc(db, 'orders', order.id), cancel ? { cancel_request: payload } : { return_request: payload });
      order = { ...order, ...(cancel ? { cancel_request: payload } : { return_request: payload }) };
      sh.close(); render(); toast('Request sent. We will get back to you soon.');
    } catch (err) { btn.disabled = false; btn.textContent = 'Send request'; toast('Could not send the request. Please message us on WhatsApp.', 'bad'); }
  });
}

(async () => {
  const user = await whenUser();
  if (!user) return location.replace(loginUrl(`order_view.html?id=${id || ''}`));
  s = await getSettings();
  if (!id) { view.innerHTML = emptyState({ ic: 'search', title: 'Order not found', href: 'order.html', cta: 'My orders' }); return; }
  try {
    const snap = await getDoc(doc(db, 'orders', id));
    if (!snap.exists() || snap.data().user_id !== user.uid) { view.innerHTML = emptyState({ ic: 'search', title: 'Order not found', text: 'We could not find this order in your account.', href: 'order.html', cta: 'My orders' }); return; }
    order = { id: snap.id, ...snap.data() };
    render();
  } catch (e) {
    if (e && e.code === 'permission-denied') { view.innerHTML = emptyState({ ic: 'search', title: 'Order not found', text: 'We could not find this order in your account.', href: 'order.html', cta: 'My orders' }); return; }
    view.innerHTML = emptyState({ ic: 'alert', title: 'Could not load this order', text: 'Check your connection and try again.', href: `order_view.html?id=${id}`, cta: 'Try again' });
  }
})();
</script>
</body>
</html>
