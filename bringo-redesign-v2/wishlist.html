<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your wishlist | Bringo</title>
<meta name="description" content="Products you saved on Bringo.">
<meta name="theme-color" content="#14307e">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bringo">
<meta property="og:title" content="Your wishlist | Bringo">
<meta property="og:description" content="Products you saved on Bringo.">
<meta property="og:image" content="https://bringo-steel.vercel.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/theme.css">
</head>
<body>
<main id="main">
  <div class="wrap">
    <div class="page-head always"><h1>Your wishlist</h1><p class="muted" id="count" aria-live="polite"></p></div>
    <div class="grid-products" id="grid" style="margin-top:16px"></div>
    <div id="recent-host"></div>
  </div>
</main>

<script type="module">
import { db, collection, getDocs } from './common/firebase-config.js';
import { mountChrome, $, getWish, getRecent, productCard, bindBuy, skeletonCards, emptyState, loadAllProducts, rail } from './common/app.js';

mountChrome({ variant: 'inner', title: 'Wishlist', active: 'wishlist' });
const grid = $('#grid');
grid.innerHTML = skeletonCards(4);
const byId = new Map();

function draw() {
  const ids = getWish();
  const items = ids.map((id) => byId.get(id)).filter(Boolean);
  $('#count').textContent = items.length ? `${items.length} saved item${items.length === 1 ? '' : 's'}` : '';
  grid.innerHTML = items.length ? items.map(productCard).join('')
    : `<div style="grid-column:1/-1">${emptyState({ ic: 'heart', title: 'Your wishlist is empty', text: 'Tap the heart on any product to save it here for later.', href: 'shop.html', cta: 'Browse products' })}</div>`;
}
bindBuy(grid, (id) => byId.get(id), { onWishRemove: () => draw() });

(async () => {
  try {
    const all = await loadAllProducts(getDocs, collection);
    all.forEach((p) => byId.set(p.id, p));
    draw();
    const recent = getRecent().map((id) => byId.get(id)).filter(Boolean).slice(0, 8);
    if (recent.length) { const h = $('#recent-host'); h.innerHTML = rail('Recently viewed', recent); bindBuy(h, (id) => byId.get(id)); }
  } catch (e) {
    grid.innerHTML = `<div style="grid-column:1/-1">${emptyState({ ic: 'alert', title: 'Could not load your wishlist', text: 'Check your connection and try again.', href: 'wishlist.html', cta: 'Try again' })}</div>`;
  }
})();
</script>
</body>
</html>
