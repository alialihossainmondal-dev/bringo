<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My orders | Bringo</title>
<meta name="description" content="Track your Bringo orders from placed to delivered.">
<meta name="theme-color" content="#14307e">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bringo">
<meta property="og:title" content="My orders | Bringo">
<meta property="og:description" content="Track your Bringo orders from placed to delivered.">
<meta property="og:image" content="https://bringo-steel.vercel.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/theme.css">
</head>
<body>
<main id="main">
  <div class="wrap wrap-narrow">
    <div class="page-head always"><h1>My orders</h1></div>
    <div class="tabs" id="tabs" role="group" aria-label="Filter orders" hidden>
      <button data-t="all" aria-pressed="true">All</button><button data-t="active" aria-pressed="false">Active</button><button data-t="delivered" aria-pressed="false">Delivered</button><button data-t="cancelled" aria-pressed="false">Cancelled</button>
    </div>
    <div class="stack" id="list" style="margin-top:16px" aria-live="polite">
      <div class="order"><div class="skel skel-line" style="width:40%;height:18px;margin:0"></div><div class="skel skel-line" style="width:25%;height:26px"></div><div class="skel skel-line" style="width:100%;height:40px;margin-top:22px"></div></div>
    </div>
  </div>
</main>

<script type="module">
import { db, collection, query, where, getDocs } from './common/firebase-config.js';
import { mountChrome, icon, esc, $, $$, rupee, whenUser, loginUrl, emptyState, getSettings, waLink } from './common/app.js';
import { when, fmtDate, shortId, trackerHtml, statusTag, isActive, isDelivered, isCancelled, isClosed } from './common/orders.js';

mountChrome({ variant: 'inner', title: 'My orders', active: 'orders' });
let orders = [], tab = 'all', settings = null;

const FILTER = { all: () => true, active: isActive, delivered: isDelivered, cancelled: (o) => isCancelled(o) };
function draw() {
  const list = $('#list');
  const rows = orders.filter(FILTER[tab]);
  if (!rows.length) { list.innerHTML = emptyState({ ic: 'package', title: tab === 'all' ? 'No orders yet' : 'No orders here', text: tab === 'all' ? 'When you place an order it will show up here, with live status.' : 'Nothing matches this filter.', href: 'shop.html', cta: 'Start shopping' }); return; }
  list.innerHTML = rows.map((o) => {
    const date = fmtDate(when(o.created_at));
    const items = o.items || [];
    const thumbs = items.slice(0, 4).map((i) => `<img src="${esc(i.image || '')}" alt="" width="52" height="52" loading="lazy">`).join('');
    const names = items.map((i) => `${esc(i.name)} x ${Number(i.qty)}`).join(', ');
    const req = o.cancel_request && !o.cancel_request.dismissed && o.status !== 'Cancelled' ? '<span class="tag tag-warn">Cancellation requested</span>' : o.return_request && !o.return_request.dismissed && !isClosed(o) ? `<span class="tag tag-warn">${esc(o.return_request.type)} requested</span>` : '';
    return `<a class="order" href="order_view.html?id=${encodeURIComponent(o.id)}">
      <div class="order-top">
        <div><div class="order-id">Order #${shortId(o.id)}${date ? ` placed on ${date}` : ''}</div><div class="order-total">${rupee(o.total_amount)}</div></div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${statusTag(o)}${req}</div>
      </div>
      ${trackerHtml(o)}
      <div class="order-thumbs">${thumbs}${items.length > 4 ? `<span class="more">+${items.length - 4} more</span>` : ''}</div>
      <p class="muted" style="font-size:14px;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${names}</p>
      <div class="order-foot"><span class="link" style="text-decoration:none">View details ${icon('chevron', 'ic-sm')}</span></div>
    </a>`;
  }).join('');
}
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  tab = b.dataset.t; $$('#tabs button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); draw();
});

(async () => {
  const list = $('#list');
  const user = await whenUser();
  if (!user) { list.innerHTML = emptyState({ ic: 'user', title: 'Log in to see your orders', text: 'Your orders are saved to your account so you can track them anywhere.', href: loginUrl('order.html'), cta: 'Log in' }); return; }
  settings = await getSettings();
  try {
    const snap = await getDocs(query(collection(db, 'orders'), where('user_id', '==', user.uid)));
    snap.forEach((d) => orders.push({ id: d.id, ...d.data() }));
    orders.sort((a, b) => (when(b.created_at) || 0) - (when(a.created_at) || 0));
    $('#tabs').hidden = !orders.length;
    draw();
  } catch (e) {
    list.innerHTML = emptyState({ ic: 'alert', title: 'Could not load your orders', text: 'Check your connection and try again.', href: 'order.html', cta: 'Try again' });
  }
})();
</script>
</body>
</html>
