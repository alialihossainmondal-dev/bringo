<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all products | Bringo</title>
<meta name="description" content="Browse and filter everyday essentials on Bringo. Sort by price, filter by category and payment type, and pay on delivery or prepay with UPI.">
<meta name="theme-color" content="#14307e">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bringo">
<meta property="og:title" content="Shop all products | Bringo">
<meta property="og:description" content="Browse and filter everyday essentials on Bringo. Sort by price, filter by category and payment type, and pay on delivery or prepay with UPI.">
<meta property="og:image" content="https://bringo-steel.vercel.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/theme.css">
</head>
<body>
<main id="main">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb" id="crumbs"></nav>
    <div class="shop">
      <div class="shop-bar no-print">
        <button class="btn" id="open-sort">Sort <span data-i="sort"></span></button>
        <button class="btn" id="open-filter">Filters <span data-i="filter"></span><span class="dot" id="fdot" hidden></span></button>
      </div>
      <aside class="filters no-print" id="filters" aria-label="Filters"></aside>
      <section aria-labelledby="shop-h">
        <div class="shop-top">
          <div><h1 id="shop-h">All products</h1><span class="muted" id="count" aria-live="polite"></span></div>
          <label class="sortbox">Sort by
            <select id="sort">
              <option value="rel">Relevance</option>
              <option value="new">Newest first</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="off">Biggest discount</option>
            </select>
          </label>
        </div>
        <div class="achips" id="achips" style="margin-top:12px"></div>
        <div class="grid-products" id="grid" style="margin-top:14px"></div>
        <div class="more-wrap" id="more" hidden><button class="btn btn-outline" id="more-btn">Show more products</button><small id="more-note"></small></div>
      </section>
    </div>
  </div>
</main>

<script type="module">
import { db, collection, getDocs } from './common/firebase-config.js';
import { mountChrome, icon, esc, $, $$, rupee, productCard, bindBuy, skeletonCards, emptyState, openSheet, loadAllProducts, createdTs, offPct } from './common/app.js';

mountChrome({ variant: 'home', active: '' });
$$('[data-i]').forEach((el) => { el.innerHTML = icon(el.dataset.i); });

const PAGE = 12;
const params = new URLSearchParams(location.search);
const st = {
  q: (params.get('q') || '').trim(), cat: params.get('cat') || '', sort: params.get('sort') || 'rel',
  min: params.get('min') || '', max: params.get('max') || '', pay: params.get('pay') || '',
  stock: params.get('stock') === '1', off: params.get('off') === '1', brand: params.get('brand') || '', shown: PAGE,
};
let products = [];
const byId = new Map();
const grid = $('#grid');
grid.innerHTML = skeletonCards(8);

const tokens = () => st.q.toLowerCase().split(/\s+/).filter(Boolean);
const hay = (p) => `${p.name} ${p.category || ''} ${p.brand || ''} ${p.description || ''}`.toLowerCase();
const score = (p, t) => t.reduce((n, w) => n + (String(p.name).toLowerCase().includes(w) ? 3 : 0) + (String(p.category || '').toLowerCase().includes(w) ? 2 : 0) + (String(p.brand || '').toLowerCase().includes(w) ? 2 : 0), 0);

function matches(p, skip = '') {
  const t = tokens(), h = hay(p);
  if (t.length && !t.every((w) => h.includes(w))) return false;
  if (skip !== 'cat' && st.cat && p.category !== st.cat) return false;
  if (skip !== 'brand' && st.brand && p.brand !== st.brand) return false;
  if (st.min !== '' && Number(p.price) < Number(st.min)) return false;
  if (st.max !== '' && Number(p.price) > Number(st.max)) return false;
  if (st.pay === 'cod' && p.payment_type === 'Prepaid') return false;
  if (st.pay === 'prepaid' && p.payment_type === 'COD') return false;
  if (st.stock && Number(p.stock) <= 0) return false;
  if (st.off && !offPct(p)) return false;
  return true;
}
function results() {
  const list = products.filter((p) => matches(p));
  const t = tokens();
  const by = {
    low: (a, b) => a.price - b.price, high: (a, b) => b.price - a.price,
    new: (a, b) => createdTs(b) - createdTs(a), off: (a, b) => offPct(b) - offPct(a),
    rel: (a, b) => (t.length ? score(b, t) - score(a, t) : createdTs(b) - createdTs(a)),
  }[st.sort] || (() => 0);
  return list.sort(by);
}
const activeCount = () => [st.cat, st.brand, st.min !== '' || st.max !== '' ? 1 : '', st.pay, st.stock, st.off].filter(Boolean).length;

function syncUrl() {
  const p = new URLSearchParams();
  if (st.q) p.set('q', st.q); if (st.cat) p.set('cat', st.cat); if (st.brand) p.set('brand', st.brand);
  if (st.sort !== 'rel') p.set('sort', st.sort); if (st.min !== '') p.set('min', st.min); if (st.max !== '') p.set('max', st.max);
  if (st.pay) p.set('pay', st.pay); if (st.stock) p.set('stock', '1'); if (st.off) p.set('off', '1');
  history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
}

/* ---------- filters (same markup in the desktop sidebar and the phone sheet) ---------- */
function facet(key) {
  const m = new Map();
  products.filter((p) => matches(p, key) && p[key === 'cat' ? 'category' : key]).forEach((p) => { const v = p[key === 'cat' ? 'category' : key]; m.set(v, (m.get(v) || 0) + 1); });
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}
function filtersHtml() {
  const cats = facet('cat'), brands = facet('brand');
  const radio = (name, v, label, n, on) => `<label class="fopt"><input type="radio" name="${name}" value="${esc(v)}"${on ? ' checked' : ''}><span>${esc(label)}</span>${n != null ? `<span class="n">${n}</span>` : ''}</label>`;
  const hasOff = products.some((p) => offPct(p));
  return `
    <div class="fgroup"><h3>Category</h3>${radio('f-cat', '', 'All categories', null, !st.cat)}${cats.map(([c, n]) => radio('f-cat', c, c, n, st.cat === c)).join('')}</div>
    ${brands.length ? `<div class="fgroup"><h3>Brand</h3>${radio('f-brand', '', 'All brands', null, !st.brand)}${brands.map(([c, n]) => radio('f-brand', c, c, n, st.brand === c)).join('')}</div>` : ''}
    <div class="fgroup"><h3>Price</h3>
      <div class="price-row"><input type="number" inputmode="numeric" min="0" placeholder="Min" data-f="min" value="${esc(st.min)}" aria-label="Minimum price"><span>to</span><input type="number" inputmode="numeric" min="0" placeholder="Max" data-f="max" value="${esc(st.max)}" aria-label="Maximum price"></div>
      <div class="chips">${[[0, 499, 'Under ₹499'], [500, 999, '₹500 to ₹999'], [1000, 1999, '₹1,000 to ₹1,999'], [2000, '', '₹2,000 and above']].map(([a, b, l]) => `<button class="chip" data-price="${a}|${b}" aria-pressed="${String(st.min) === String(a) && String(st.max) === String(b)}">${l}</button>`).join('')}</div>
    </div>
    <div class="fgroup"><h3>Payment</h3>${radio('f-pay', '', 'Any', null, !st.pay)}${radio('f-pay', 'cod', 'Cash on delivery available', null, st.pay === 'cod')}${radio('f-pay', 'prepaid', 'Prepaid (UPI) available', null, st.pay === 'prepaid')}</div>
    <div class="fgroup"><h3>More</h3>
      <label class="fopt"><input type="checkbox" data-f="stock"${st.stock ? ' checked' : ''}><span>In stock only</span></label>
      ${hasOff ? `<label class="fopt"><input type="checkbox" data-f="off"${st.off ? ' checked' : ''}><span>Discounted items only</span></label>` : ''}
    </div>
    <button class="btn btn-outline btn-block" data-reset style="margin-top:20px">Reset all filters</button>`;
}
function bindFilters(root, after) {
  const apply = () => { st.shown = PAGE; render(); if (after) after(); };
  root.addEventListener('change', (e) => {
    const t = e.target;
    if (t.name === 'f-cat') st.cat = t.value; else if (t.name === 'f-brand') st.brand = t.value; else if (t.name === 'f-pay') st.pay = t.value;
    else if (t.dataset.f === 'stock') st.stock = t.checked; else if (t.dataset.f === 'off') st.off = t.checked;
    else if (t.dataset.f === 'min') st.min = t.value.trim(); else if (t.dataset.f === 'max') st.max = t.value.trim();
    else return;
    apply();
  });
  root.addEventListener('click', (e) => {
    const c = e.target.closest('[data-price]');
    if (c) { const [a, b] = c.dataset.price.split('|'); const same = String(st.min) === a && String(st.max) === b; st.min = same ? '' : a; st.max = same ? '' : b; return apply(); }
    if (e.target.closest('[data-reset]')) { Object.assign(st, { cat: '', brand: '', min: '', max: '', pay: '', stock: false, off: false }); apply(); }
  });
}
const side = $('#filters');
bindFilters(side);

/* ---------- render ---------- */
let sheet = null;
function render() {
  const list = results();
  const heading = st.q ? `Results for “${st.q}”` : st.cat || 'All products';
  $('#shop-h').textContent = heading;
  document.title = `${heading} | Bringo`;
  $('#sort').value = st.sort;
  $('#count').textContent = products.length ? `${list.length} item${list.length === 1 ? '' : 's'}` : '';
  $('#crumbs').innerHTML = `<a href="index.html">Home</a>${icon('chevron')}${st.cat || st.q ? `<a href="shop.html">Shop</a>${icon('chevron')}<span aria-current="page">${esc(st.cat || `“${st.q}”`)}</span>` : '<span aria-current="page">Shop</span>'}`;
  const chips = [];
  if (st.q) chips.push(['q', `Search: ${st.q}`]);
  if (st.cat) chips.push(['cat', st.cat]); if (st.brand) chips.push(['brand', st.brand]);
  if (st.min !== '' || st.max !== '') chips.push(['price', `${st.min !== '' ? rupee(st.min) : '₹0'} to ${st.max !== '' ? rupee(st.max) : 'any'}`]);
  if (st.pay) chips.push(['pay', st.pay === 'cod' ? 'Cash on delivery' : 'Prepaid']);
  if (st.stock) chips.push(['stock', 'In stock']); if (st.off) chips.push(['off', 'Discounted']);
  $('#achips').innerHTML = chips.map(([k, l]) => `<button class="achip" data-rm="${k}">${esc(l)} ${icon('x', 'ic-sm')}</button>`).join('') + (chips.length > 1 ? '<button class="achip achip-clear" data-rm="all">Clear all</button>' : '');
  $('#fdot').hidden = !activeCount();
  const page = list.slice(0, st.shown);
  grid.innerHTML = page.length ? page.map(productCard).join('')
    : `<div style="grid-column:1/-1">${emptyState({ ic: 'search', title: products.length ? 'No products match' : 'No products yet', text: products.length ? 'Try fewer filters or a different word.' : 'New products are on the way. Check back soon.' })}${products.length && chips.length ? '<div style="text-align:center;margin-top:-4px"><button class="btn btn-dark" data-rm="all">Clear all filters</button></div>' : ''}</div>`;
  $('#more').hidden = list.length <= st.shown;
  $('#more-note').textContent = `Showing ${Math.min(st.shown, list.length)} of ${list.length}`;
  side.innerHTML = filtersHtml();
  if (sheet) { const body = $('.sheet-body', sheet.el); if (body && body.dataset.kind === 'filter') { body.innerHTML = filtersHtml(); $('#sheet-n').textContent = list.length; } }
  syncUrl();
}
$('#achips').addEventListener('click', clearChip);
grid.addEventListener('click', clearChip);
function clearChip(e) {
  const b = e.target.closest('[data-rm]');
  if (!b) return;
  const k = b.dataset.rm;
  if (k === 'all') Object.assign(st, { q: '', cat: '', brand: '', min: '', max: '', pay: '', stock: false, off: false });
  else if (k === 'price') { st.min = ''; st.max = ''; } else if (k === 'stock' || k === 'off') st[k] = false; else st[k] = '';
  if (k === 'q' || k === 'all') $('#q').value = '';
  st.shown = PAGE; render();
}
$('#sort').addEventListener('change', (e) => { st.sort = e.target.value; st.shown = PAGE; render(); });
$('#more-btn').addEventListener('click', () => { st.shown += PAGE; render(); });
window.addEventListener('bringo:search', (e) => { st.q = String(e.detail || '').trim(); st.shown = PAGE; render(); });
bindBuy(grid, (id) => byId.get(id));

/* ---------- phone sheets ---------- */
$('#open-filter').addEventListener('click', () => {
  sheet = openSheet({ title: 'Filters', html: filtersHtml(), foot: `<button class="btn btn-primary" data-close>Show <span id="sheet-n">${results().length}</span> items</button>`, onClose: () => { sheet = null; } });
  sheet.el.querySelector('.sheet-body').dataset.kind = 'filter';
  bindFilters(sheet.el.querySelector('.sheet-body'));
});
$('#open-sort').addEventListener('click', () => {
  const opts = [['rel', 'Relevance'], ['new', 'Newest first'], ['low', 'Price: low to high'], ['high', 'Price: high to low'], ['off', 'Biggest discount']];
  const s = openSheet({ title: 'Sort by', html: opts.map(([v, l]) => `<label class="fopt"><input type="radio" name="sortm" value="${v}"${st.sort === v ? ' checked' : ''}><span>${l}</span></label>`).join('') });
  s.el.addEventListener('click', (e) => { if (e.target.name !== 'sortm') return; st.sort = e.target.value; st.shown = PAGE; render(); s.close(); });
});

(async () => {
  try {
    products = await loadAllProducts(getDocs, collection);
    products.forEach((p) => byId.set(p.id, p));
  } catch (e) {
    grid.innerHTML = `<div style="grid-column:1/-1">${emptyState({ ic: 'alert', title: 'Could not load products', text: 'Check your connection and try again.', href: 'shop.html', cta: 'Try again' })}</div>`;
    return;
  }
  if (st.q) $('#q').value = st.q;
  render();
})();
</script>
</body>
</html>
