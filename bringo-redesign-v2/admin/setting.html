<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <script>document.documentElement.style.visibility='hidden'</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#b91c1c">
    <link rel="apple-touch-icon" href="../assets/admin-icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Admin - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 pb-20">
    <div class="bg-orange-600 text-white p-4 sticky top-0 flex items-center shadow-md">
        <a href="index.html" class="mr-4"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <h1 class="text-xl font-bold">Global Settings</h1>
    </div>

    <div class="p-4 space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 class="font-bold text-gray-800 mb-1"><i class="fa-solid fa-store text-orange-500 mr-2"></i>Store details</h2>
            <p class="text-xs text-gray-500 mb-4">These show on the website (Contact page, footer, policy pages, WhatsApp buttons). Leave a field empty to hide it.</p>
            <form id="store-form" class="space-y-3">
                <label class="block text-xs font-bold text-gray-500">WhatsApp number (with country code, digits only)
                    <input id="f-whatsapp" inputmode="numeric" placeholder="917872075844" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                <label class="block text-xs font-bold text-gray-500">Instagram username (without @)
                    <input id="f-instagram" placeholder="shopbringo" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                <label class="block text-xs font-bold text-gray-500">Support phone
                    <input id="f-phone" placeholder="+91 98765 43210" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                <label class="block text-xs font-bold text-gray-500">Support email
                    <input id="f-email" type="email" placeholder="support@yourdomain.com" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                <label class="block text-xs font-bold text-gray-500">Business address
                    <textarea id="f-address" rows="2" placeholder="Shop / business address" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></textarea></label>
                <label class="block text-xs font-bold text-gray-500">Support hours
                    <input id="f-hours" placeholder="Mon to Sat, 10 am to 7 pm" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                <label class="block text-xs font-bold text-gray-500">Announcement bar (top of every page)
                    <input id="f-announcement" placeholder="Free delivery on orders above Rs 999" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="block text-xs font-bold text-gray-500">Delivery time
                        <input id="f-delivery_time" placeholder="3 to 7 working days" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                    <label class="block text-xs font-bold text-gray-500">Processing time
                        <input id="f-processing_time" placeholder="1 to 2 working days" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                    <label class="block text-xs font-bold text-gray-500">Return window (days)
                        <input id="f-return_days" type="number" min="0" max="60" placeholder="7" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                    <label class="block text-xs font-bold text-gray-500">Banner speed (seconds)
                        <input id="f-banner_interval" type="number" min="2" max="20" placeholder="4" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 font-normal"></label>
                </div>
                <button type="submit" id="save-store-btn" class="w-full bg-gray-900 text-white font-bold py-2.5 rounded-lg shadow hover:bg-black">Save store details</button>
                <p id="store-msg" class="text-xs font-bold text-green-600 hidden">Saved. Changes show on the website right away.</p>
            </form>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 class="font-bold text-gray-800 mb-4"><i class="fa-solid fa-qrcode text-orange-500 mr-2"></i>Payment QR Setup</h2>
            
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-500 mb-1">Current QR Code</label>
                <img id="current-qr" src="../assets/placeholder.svg" class="w-32 h-32 border-2 border-dashed border-gray-300 rounded-lg object-contain">
            </div>

            <input type="file" id="qr-upload" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 mb-4">
            
            <button id="save-qr-btn" class="w-full bg-orange-500 text-white font-bold py-2 rounded-lg shadow hover:bg-orange-600">
                Upload & Save
            </button>
        </div>
    </div>

    <script type="module" src="guard.js"></script>
    <script type="module">
        import { db, doc, getDoc, setDoc } from '../common/firebase-config.js';

        // আপনার ImgBB API Key এখানে দিন
        const IMGBB_API_KEY = "84d1381ec359c2c06ec716c61534f33e";


        // ---- Store details form (writes settings/global, merged so the QR url is kept)
        const KEYS = ['whatsapp','instagram','phone','email','address','hours','announcement','delivery_time','processing_time','return_days','banner_interval'];
        const NUM = new Set(['return_days','banner_interval']);
        (async () => {
            try {
                const snap = await getDoc(doc(db, "settings", "global"));
                const d = snap.exists() ? snap.data() : {};
                KEYS.forEach(k => { const el = document.getElementById('f-' + k); if (el && d[k] != null) el.value = d[k]; });
            } catch (e) { /* form stays empty */ }
        })();
        document.getElementById('store-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-store-btn'), msg = document.getElementById('store-msg');
            const data = {};
            KEYS.forEach(k => {
                let v = document.getElementById('f-' + k).value.trim();
                if (k === 'whatsapp') v = v.replace(/\D/g, '');
                if (k === 'instagram') v = v.replace(/^@/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//, '').replace(/\/$/, '');
                data[k] = NUM.has(k) ? (v === '' ? null : Number(v)) : v;
            });
            Object.keys(data).forEach(k => { if (data[k] === null) delete data[k]; });
            btn.disabled = true; btn.textContent = 'Saving...'; msg.classList.add('hidden');
            try {
                await setDoc(doc(db, "settings", "global"), data, { merge: true });
                msg.classList.remove('hidden');
            } catch (err) { alert("Could not save: " + err.message); }
            btn.disabled = false; btn.textContent = 'Save store details';
        });

        const qrImg = document.getElementById('current-qr');
        const uploadInput = document.getElementById('qr-upload');
        const saveBtn = document.getElementById('save-qr-btn');

        async function loadQR() {
            const docSnap = await getDoc(doc(db, "settings", "global"));
            if(docSnap.exists() && docSnap.data().upi_qr_code_image_url) {
                qrImg.src = docSnap.data().upi_qr_code_image_url;
            }
        }
        loadQR();

        saveBtn.addEventListener('click', async () => {
            const file = uploadInput.files[0];
            if(!file) return alert("Select an image first!");
            
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';
            
            try {
                const formData = new FormData();
                formData.append('image', file);
                
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if(data.success) {
                    const url = data.data.url;
                    await setDoc(doc(db, "settings", "global"), { upi_qr_code_image_url: url }, { merge: true });
                    qrImg.src = url;
                    uploadInput.value = '';
                    alert("Payment QR Updated successfully!");
                } else {
                    alert("Image upload failed!");
                }
            } catch (e) {
                alert("Error: " + e.message);
            } finally {
                saveBtn.innerHTML = 'Upload & Save';
            }
        });
    </script>
</body>
</html>
