<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account | Bringo</title>
<meta name="description" content="Manage your Bringo account, saved addresses, wishlist and orders.">
<meta name="theme-color" content="#14307e">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bringo">
<meta property="og:title" content="Your account | Bringo">
<meta property="og:description" content="Manage your Bringo account, saved addresses, wishlist and orders.">
<meta property="og:image" content="https://bringo-steel.vercel.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/theme.css">
</head>
<body>
<main id="main">
  <div class="wrap wrap-narrow">
    <div class="page-head"><h1>Your account</h1></div>
    <div class="profile-card" id="who"><span class="avatar skel"></span><div style="flex:1"><div class="skel skel-line" style="width:60%;height:20px;margin:0"></div><div class="skel skel-line" style="width:80%"></div></div></div>

    <div class="stack" style="margin-top:16px">
      <nav class="menu" aria-label="Account links">
        <a href="order.html"><span data-i="package"></span>My orders<span data-i="chevron"></span></a>
        <a href="wishlist.html"><span data-i="heart"></span>Wishlist<span data-i="chevron"></span></a>
        <a href="addresses.html"><span data-i="pin"></span>Saved addresses<span data-i="chevron"></span></a>
        <a id="wa-help" href="#" target="_blank" rel="noopener"><span data-i="whatsapp"></span>Chat with us on WhatsApp<span data-i="chevron"></span></a>
        <a href="shipping.html"><span data-i="truck"></span>Shipping and delivery<span data-i="chevron"></span></a>
        <a href="returns.html"><span data-i="undo"></span>Returns and refunds<span data-i="chevron"></span></a>
        <a href="privacy.html"><span data-i="lock"></span>Privacy policy<span data-i="chevron"></span></a>
        <a href="terms.html"><span data-i="file"></span>Terms of use<span data-i="chevron"></span></a>
      </nav>

      <button class="btn btn-outline btn-block" id="logout"><span data-i="logout"></span> Log out</button>
    </div>
  </div>
</main>

<script type="module">
import { auth, signOut } from './common/firebase-config.js';
import { mountChrome, icon, esc, $, $$, initials, whenUser, loginUrl, getSettings, waLink } from './common/app.js';

mountChrome({ variant: 'inner', title: 'Your account', active: 'account' });
$$('[data-i]').forEach((el) => { el.innerHTML = icon(el.dataset.i); });
getSettings().then((s) => { $('#wa-help').href = waLink(s.whatsapp, 'Hi Bringo, I need help with my account.'); });

whenUser().then((u) => {
  if (!u) return location.replace(loginUrl('profile.html'));
  $('#who').innerHTML = `${u.photoURL ? `<img class="avatar" style="width:62px;height:62px" src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : `<span class="avatar">${esc(initials(u.displayName))}</span>`}<div style="min-width:0"><h2>${esc(u.displayName || 'Your account')}</h2><p>${esc(u.email || '')}</p></div>`;
});

$('#logout').addEventListener('click', async () => { await signOut(auth); location.href = 'index.html'; });
</script>
</body>
</html>
